<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Lockstep</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <p id="rotate-hint">For gameplay, rotate your device to landscape.</p>
    <section id="touch-controls" aria-label="Touch controls">
      <div data-screen="title">
        <div class="touch-row">
          <select id="touch-song" aria-label="Song"></select
          ><select id="touch-level" aria-label="Difficulty">
            <option value="0">Easy</option>
            <option value="1">Normal</option>
            <option value="2">Hard</option></select
          ><button data-key="Enter" class="primary">Play</button>
        </div>
        <div class="touch-row">
          <button data-key="o">Add file</button
          ><button data-key="f">Audius</button
          ><button data-key="t" id="touch-theme">Theme</button
          ><button id="touch-share" data-key="c">Share</button
          ><button data-settings>Settings</button>
        </div>
      </div>
      <form data-screen="find" id="touch-find">
        <div class="touch-row">
          <input
            id="touch-search"
            type="search"
            placeholder="Search Audius"
            aria-label="Search Audius"
            autocomplete="off"
          /><button type="submit" class="primary">Add track</button>
        </div>
        <div class="touch-row">
          <button type="button" data-key="ArrowUp">Previous</button
          ><button type="button" data-key="ArrowDown">Next</button
          ><button type="button" data-key="Escape">Back</button>
        </div>
      </form>
      <div data-screen="play" class="touch-row play-pads">
        <button data-pad="ArrowLeft" aria-label="Previous instrument">
          ← Track</button
        ><button data-pad="ArrowRight" aria-label="Next instrument">
          Track →</button
        ><button class="hit" data-pad="j" aria-label="Hit left lane">
          Left</button
        ><button class="hit" data-pad="k" aria-label="Hit middle lane">
          Middle</button
        ><button class="hit" data-pad="l" aria-label="Hit right lane">
          Right</button
        ><button data-pad=" " aria-label="Pause">Pause</button>
      </div>
      <div data-screen="pause">
        <div class="touch-row">
          <button data-key=" " class="primary" id="touch-resume">Resume</button
          ><button data-key="r">Restart</button
          ><button data-key="Escape">Songs</button
          ><button data-settings>Settings</button>
        </div>
        <p id="touch-status">Tap Resume for the countdown.</p>
      </div>
      <div data-screen="over failed">
        <div class="touch-row">
          <button data-key="Enter" class="primary">Play again</button
          ><button data-key="Escape">Songs</button>
        </div>
      </div>
      <div data-screen="loading"><p>Loading your track…</p></div>
      <div id="touch-settings" hidden>
        <p id="touch-offset" role="status"></p>
        <p>Raise the offset if notes feel early; lower it if they feel late.</p>
        <div class="touch-row">
          <button data-key="[">−10 ms</button
          ><button data-key="]">+10 ms</button
          ><button id="touch-default">Set theme default</button
          ><button id="touch-delete" data-key="x">Delete song</button
          ><button data-settings>Done</button>
        </div>
      </div>
    </section>
    <script type="module" src="app.js"></script>
  </body>
</html>
