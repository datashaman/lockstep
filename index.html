// Lockstep: original phrase-capture rhythm game. J K L = lanes, A / D = switch track.

  beats: Array.from({ length: BARS * 4 + 1 }, (_, k) => k * BEAT),

let mode = 'title', catalog = [], sel = 0, loadErr = '', srcs = [];
let level = +(globalThis.localStorage?.lockstepLevel ?? 1);
let offset = +(globalThis.localStorage?.lockstepOffset || 0), offsetAt = -9; // player's audio calibration, seconds
let beats, bars, gridDown;
let hits = 0, misses = 0, caps = 0, shown = 0, rt = 0, last = performance.now() / 1000, phase = 0, pulse = 0;
let camX = 0, camTo = 0, bendX = 0, bendY = 0, bendAmp = .6, hue = HUES[0], shake = 0, missAt = -9, flash = null;
let dash = null, entrance = null, inSync = false, syncAt = -9;
let pauseState = null, visualOffset = 0;
let groove = 100, missStreak = 0, failedAt = 0;

const voices = new Map();
let parts = [], pops = [], rings = [], press = [-9, -9, -9], laneHit = new Array(12).fill(-9);

}
const auto = (tr, n) => n.bar >= tr.capFrom && n.bar < tr.capTo;
const locked = (tr, t) => bar(t) < tr.capTo;
const captureRemaining = (tr, t) => Math.max(0, Math.min(1, (tr.capTo - barF(t)) / CAPTURE_BARS));
const trackX = i => (i - 1.5) * (TW + GAP);

// Beat grid: the song's beats, extended back through the count-in and forward past the end.

function thin(notes, lv) {

  text('Music streamed from audius.co by its artists, under the Audius Open Music License', W / 2, 560, `500 11px ${MONO}`, 'rgba(255,255,255,.45)');
}

function drawFailure() {
  g.globalAlpha = 1; g.fillStyle = 'rgba(3,2,6,.9)'; g.fillRect(0, 0, W, H);
  text('GROOVE LOST', W / 2, 215, `italic 900 54px ${SANS}`, '#ff4d6d');
  text(fit(song.title, 660, `700 22px ${SANS}`), W / 2, 265, `700 22px ${SANS}`, '#fff');
  text(`${Math.min(100, Math.floor(failedAt / song.duration * 100))}% COMPLETE · ${score.toLocaleString()} POINTS`, W / 2, 310, `600 15px ${MONO}`, '#a6b6c8');
  text('Hits restore groove. Captures give you a bigger recovery.', W / 2, 355, `500 15px ${SANS}`, '#a6b6c8');
  zones = [];
  [['SPACE / ENTER', 'Retry', reset], ['ESC', 'Song selection', toTitle]].forEach(([key, label, action], i) => {
    const y = 395 + i * 54; box(220, y, 360, 44, 8, 'rgba(255,255,255,.08)', 'rgba(255,255,255,.2)');
    shortcut(key, label, W / 2, y + 28); zone(220, y, 360, 44, () => action());
  });
}

function drawResults() {
  const acc = hits / Math.max(1, hits + misses), gr = grade(acc), record = best[`${playKey}:${level}`];
  const [title, artist = ''] = song.title.split(' — ');
  g.globalAlpha = 1; g.fillStyle = 'rgba(3,2,6,.94)'; g.fillRect(0, 0, W, H);
  text(`SESSION COMPLETE / ${LEVELS[level].name}`, 48, 50, `700 11px ${MONO}`, '#a6b6c8', 'left');
  text(fit(title, 704, `900 32px ${SANS}`), 48, 91, `900 32px ${SANS}`, '#fff', 'left');
  if (artist) text(fit(artist, 704, `600 14px ${SANS}`), 48, 115, `600 14px ${SANS}`, '#a6b6c8', 'left');
  drawSleeve(song, 48, 136, 310, 190, false);
  text(gr, 450, 265, `italic 900 124px ${SANS}`, `hsl(${hue},95%,75%)`, 'center', 18);
  text('SCORE', 752, 165, `700 10px ${MONO}`, '#a6b6c8', 'right');
  text(score.toLocaleString(), 752, 207, `700 34px ${MONO}`, '#fff', 'right');
  text(`${(acc * 100).toFixed(1)}% ACCURACY`, 752, 241, `600 12px ${MONO}`, '#a6b6c8', 'right');
  text(`${caps} CAPTURES`, 752, 264, `600 12px ${MONO}`, '#a6b6c8', 'right');
  const totalTiming = tracks.reduce((sum, tr) => sum + tr.timing, 0);
  text(hits ? `AVG ${timingLabel(totalTiming / hits)}` : 'AVG TIMING —', 752, 286, `600 11px ${MONO}`, '#a6b6c8', 'right');
  text(newBest ? 'NEW PERSONAL BEST' : `BEST  ${record ? record.score.toLocaleString() : '—'}`, 752, 308, `800 13px ${MONO}`, newBest ? '#3ddc97' : '#a6b6c8', 'right');
  text('INSTRUMENT', 64, 365, `700 10px ${MONO}`, '#a6b6c8', 'left');
  text('HITS / MISSES', 380, 365, `700 10px ${MONO}`, '#a6b6c8', 'right');
  text('ACCURACY', 500, 365, `700 10px ${MONO}`, '#a6b6c8', 'right');
  text('AVG TIMING', 640, 365, `700 10px ${MONO}`, '#a6b6c8', 'right');
  text('CAPTURES', 736, 365, `700 10px ${MONO}`, '#a6b6c8', 'right');
  tracks.forEach((tr, i) => {
    const y = 393 + i * 29, attempts = tr.hits + tr.misses;
    if (i % 2 === 0) { g.fillStyle = 'rgba(255,255,255,.035)'; g.fillRect(48, y - 19, 704, 28); }
    text(tr.name, 64, y, `800 12px ${SANS}`, tr.color, 'left');
    text(`${tr.hits} / ${tr.misses}`, 380, y, `600 12px ${MONO}`, '#fff', 'right');
    text(attempts ? `${(tr.hits / attempts * 100).toFixed(1)}%` : tr.notes.length ? 'UNPLAYED' : 'SILENT', 500, y, `600 11px ${MONO}`, '#a6b6c8', 'right');
    text(tr.hits ? timingLabel(tr.timing / tr.hits) : '—', 640, y, `600 10px ${MONO}`, '#a6b6c8', 'right');
    text(String(tr.caps), 736, y, `600 12px ${MONO}`, '#fff', 'right');
  });
  text('Manual hits and misses only · AUTO notes excluded', 48, 512, `500 10px ${MONO}`, '#a6b6c8', 'left');
  shortcut('SPACE', 'play again', 260, 558); shortcut('ESC', 'song selection', 540, 558);
}

setGrid(song); tracks = buildTracks(); rebuild(); applyTheme(catalog[sel]);
requestAnimationFrame(frame);

// Self-check: every phrase of every demo chart has notes, no step is doubled, and the grid maps times to bars.
['drums', 'bass', 'arp', 'lead'].forEach((k, i) => { const ns = chart(k, 7 + i * 101);
  for (let p = 0; p < BARS / 2; p++) console.assert(ns.some(([t]) => Math.floor(t / BARLEN / 2) === p), k, 'phrase empty', p);
  console.assert(new Set(ns.map(n => n[0])).size === ns.length, k, 'duplicate step'); });
console.assert(bar(0) === 0 && bar(BARLEN * 5 + .01) === 5 && bar(-1) === 0 && Math.abs(barF(BARLEN * 2.5) - 2.5) < 1e-9, 'grid');
{ // difficulty: easy <= 1 note per beat and >= ~a beat apart; normal has no 16ths and leaves the 8th-note demo charts untouched
  const n16 = [[0, 0], [STEP, 1], [2 * STEP, 2], [3 * STEP, 0], [BEAT, 1], [BEAT + 2 * STEP, 2], [2 * BEAT + 2 * STEP, 0], [3 * BEAT, 1]];
  const e = thin(n16, 0), nm = thin(n16, 1);
  console.assert(nm.length === 6 && nm.every(([t]) => slot(t)[1] % 2 === 0), 'normal thinning', nm);
  console.assert(e.length === 3 && e.every((n, i) => !i || n[0] - e[i - 1][0] >= BEAT * .9) && e[0][0] === 0 && e[1][0] === BEAT, 'easy thinning', e);
  for (const tr of demoSong().tracks) console.assert(thin(tr.notes, 1).length === tr.notes.length, 'normal keeps the demo', tr.name);
}
