const peek = globalThis.Audio ? new Audio() : null; let peekTimer;
function preview() { // stream the highlighted track from a little way in, once the selection settles; stops outside the finder

  peekTimer = setTimeout(() => { peek.src = `${AUDIUS}/${t.id}/stream?${APP}#t=${t.preview_start_seconds ?? Math.round(Math.min(30, t.duration * .3))}`;

function findKey(e) {

// ---------- audio ----------
const hz = m => 440 * 2 ** ((m - 69) / 12);

// ---------- fx (x is in hit-plane world space: screen x = W/2 + x - camX) ----------

const popup = (text, x, y, color, size, life = .7) => pops.push({ text, x, y, color, size, life, born: rt });

// ---------- gameplay ----------
// Switching is always the player's call: A/D goes to the nearest non-silent track that way, including auto tracks (no wrap-around), or nowhere.
const playable = (tr, t) => tr.notes.length && !locked(tr, t);

const timingLabel = delta => Math.abs(delta) < .0005 ? 'ON TIME' : `${Math.round(Math.abs(delta) * 1000)} ms ${delta < 0 ? 'EARLY' : 'LATE'}`;

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  if (mode === 'find') return findKey(e); // before the global keys: the search box takes [ ] and letters
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (mode === 'pause') {
    e.preventDefault?.();
    if (k === ' ' || k === 'enter') { if (pauseState.deadline) pauseState.deadline = 0; else resumeCountdown(); }
    else if (k === 'r') resumeGame('restart'); else if (k === 'escape') resumeGame('menu');
    return;
  }
  if (k === '[' || k === ']') { // calibration: raise if notes feel early vs the music, lower if late
    offset = Math.round((offset + (k === ']' ? .01 : -.01)) * 100) / 100; offsetAt = rt;
    if (globalThis.localStorage) localStorage.lockstepOffset = offset; return; }
  if (mode === 'title') {
    if (!ac) { initAudio(); showSelected(); } // first key: audio is allowed now, so start the backdrop song
    if (help) { help = false; return; }
    if (k === 'arrowleft' || k === 'a' || k === 'arrowright' || k === 'd') setLevel(level + (k === 'arrowleft' || k === 'a' ? -1 : 1));
    else if (k === 'arrowup' || k === 'w') pick((sel + catalog.length - 1) % catalog.length);
    else if (k === 'arrowdown' || k === 's') pick((sel + 1) % catalog.length);
    else if (k === 'enter' || k === ' ') start();
    else if (k === 't') chooseTheme(e.shiftKey);
    else if (k === 'o') picker.click();
    else if (k === 'f') { pick(catalog.indexOf(FIND)); start(); }
    else if (k === '?' || k === '/') help = true;
    else if ((k === 'x' || k === 'delete' || k === 'backspace') && catalog[sel].lib) {
      if (rt - delArm < 2) { delArm = -9; removeSong(catalog[sel]); } else { delArm = rt; say(`press ${k === 'x' ? 'X' : k} again to delete ${catalog[sel].title}`, 'info'); } }
    return;
  }
  if (mode === 'over' || mode === 'failed') { if (k === ' ' || k === 'enter') reset(); else if (k === 'escape') toTitle(); return; }
  if (mode !== 'play') return;
  const lane = 'jkl'.indexOf(k);
  if (k === ' ' || k === 'escape') { e.preventDefault?.(); pauseGame(); }
  else if (lane >= 0) tryHit(lane);
  else if (k === 'a' || k === 'arrowleft') move(-1);
  else if (k === 'd' || k === 'arrowright') move(1);
});

function pauseGame() {
  if (mode === 'pause') { pauseState.deadline = 0; return; }
  if (mode !== 'play') return;
  const image = document.createElement('canvas'); image.width = cv.width; image.height = cv.height;
  image.getContext('2d').drawImage(cv, 0, 0);
  const state = { image, at: performance.now() / 1000, deadline: 0, busy: false };
  pauseState = state; mode = 'pause';
  state.ready = ac.suspend().catch(err => {
    if (pauseState === state) { mode = 'play'; pauseState = null; say(`could not pause: ${err.message || err}`, 'err'); }
  });
}

  const state = pauseState; if (!state || state.busy) return;
  state.busy = true;

  try {
    await ac.resume();
    if (document.hidden) { await ac.suspend(); state.busy = false; state.deadline = 0; return; }
    visualOffset += performance.now() / 1000 - state.at;
    pauseState = null; mode = 'play';
    if (action === 'restart') reset(); else if (action === 'menu') toTitle();

    state.busy = false; state.deadline = 0; say(`could not resume: ${err.message || err}`, 'err');

}

  g.fillStyle = 'rgba(3,2,6,.82)'; g.fillRect(0, 0, W, H);
  const remaining = state.deadline ? Math.max(0, state.deadline - performance.now() / 1000) : 0;
  text(state.deadline ? String(Math.ceil(remaining)) : 'PAUSED', W / 2, 245, `italic 900 64px ${SANS}`, '#fff');
  text(fit(song.title, 640, `600 18px ${SANS}`), W / 2, 290, `600 18px ${SANS}`, '#a6b6c8');
  zones = [];
  if (!state.deadline && !state.busy) {

}

function updateSync(t) {
  const active = tracks.filter(tr => tr.notes.length);
  const complete = active.length > 0 && active.every(tr => locked(tr, t));
  if (complete && !inSync) syncAt = rt;
  inSync = complete;
}

function logic(t) {
  const end = song.duration, upto = songTime(ac.currentTime - t0 + .1);
  for (const bt of beats) { if (bt >= 0) break; if (bt >= sched && bt < upto && bt >= -LEAD_IN) tone('square', 84, audioTime(bt), .06, .05); } // count-in
  if (song.synth) {
    for (let s = Math.ceil(sched / (2 * STEP)) * 2 * STEP; s < upto && s < end; s += 2 * STEP) if (s >= 0) hiss(audioTime(s), .03, .05, 9000);
    for (let b = Math.ceil(sched / BARLEN); b * BARLEN < upto && b < BARS; b++) if (b >= 0) pad(b, audioTime(b * BARLEN));
  }
  for (const tr of tracks) {
    if (song.synth) for (let k = noteIndex(tr.notes, sched); k < tr.notes.length && tr.notes[k].t < upto; k++) {
      const n = tr.notes[k]; if (auto(tr, n)) play(tr.kind, n.lane, n.bar, audioTime(n.t));
    }
    const judgedAt = audioTime(t);
    while (tr.judged < tr.notes.length) {
      const n = tr.notes[tr.judged];
      if (!n.hit && !n.missed && judgedAt - audioTime(n.t) <= LEVELS[level].win) break;
      tr.judged++;
      if (n.hit || n.missed) continue;
      n.missed = true;
      if (tr === tracks[cur] && !auto(tr, n)) {
        mult = 1; misses++; tr.misses++; missAt = rt; shake = Math.max(shake, 3); tr.live = false;

      }

      if (lv !== tr.level) { tr.level = lv; tr.gain.gain.setTargetAtTime(lv, ac.currentTime, .02); } }

function frame() {
  const wall = performance.now() / 1000, fdt = Math.min(.05, wall - last); last = wall;
  if (mode === 'pause') { drawPause(); requestAnimationFrame(frame); return; }
  rt = wall - visualOffset;

  if (mode === 'play') logic(t);

  camTo = playing ? trackX(cur) : Math.sin(rt * .4) * 200;

// ---------- rendering ----------
// The highway bends: offsets grow with the square of distance ahead, so the hit line never moves and only the road ahead sways.
function P(x, dt) { const s = F / (F + Math.max(dt, -.35)), c = (Math.max(0, dt) / LOOK) ** 2;
  return [W / 2 + (x - camX) * s + bendX * c, HZ + (HIT_Y - HZ) * s - bendY * c]; }

function quad(x0, x1, d0, d1) { const n = steps(d0, d1); g.beginPath();
  for (let k = 0; k <= n; k++) g.lineTo(...P(x0, d0 + (d1 - d0) * k / n));

const sx = x => W / 2 + x - camX;
function text(s, x, y, font, color, align = 'center', glow = 0) {

  g.fillText(s, x, y); g.shadowBlur = 0;

// Capture strength follows the existing lock lifetime; scenery never outlives its instrument.
function captureLight(tr, t) {

}
function drawLiquidWorld(t, playing, vx, vy) {

  water.addColorStop(0, '#123c48'); water.addColorStop(1, '#020f1b');
  g.fillStyle = water; g.globalAlpha = .8; g.fillRect(-200, vy, W + 400, H);
  tracks.forEach((tr, i) => {
    const light = playing ? captureLight(tr, t) : .2;
    g.strokeStyle = tr.color;

{ // difficulty: easy <= 1 note per beat and >= ~a beat apart; normal has no 16ths and leaves the 8th-note demo charts untouched
  const n16 = [[0, 0], [STEP, 1], [2 * STEP, 2], [3 * STEP, 0], [BEAT, 1], [BEAT + 2 * STEP, 2], [2 * BEAT + 2 * STEP, 0], [3 * BEAT, 1]];
